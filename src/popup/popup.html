<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../lib/ui.css">

  <style>
    /* Popup-specific overrides */
    body {
      width: 320px;
    }

    /* Popup has no bottom tabs, so no padding needed */
    .tab-content {
      padding-bottom: 0;
    }

    /* Popup-specific height constraints */
    .container-list {
      max-height: 260px;
    }

    .domain-list {
      max-height: 160px;
    }

    .exclusion-list {
      max-height: 80px;
    }

    .blend-list {
      max-height: 80px;
    }

    .pending-list {
      max-height: 300px;
    }

    /* Overlay sits above popup content */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
      overflow-y: auto;
    }

    .overlay .dialog {
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 24px;
      max-width: 100%;
      width: auto;
      min-width: 280px;
    }
  </style></head>

<body class="vessel-popup">
  <!-- List View (Container list with search) -->
  <div id="listView" class="tab-content">
    <div id="listViewHeader"></div>
    <div id="containerListContainer"></div>
    <div id="actionBarContainer"></div>
  </div>

  <!-- Settings View -->
  <div id="settingsView" class="settings-view tab-content">
    <div id="settingsViewHeader"></div>
    <div class="settings-content"></div>
  </div>

  <!-- Detail View (Container details) -->
  <div id="detailView" class="detail-view tab-content">
    <header>
      <button class="back-btn" id="backBtn">&#8592;</button>
      <h1 id="detailTitle">Container</h1>
    </header>
    <div class="detail-content"></div>
  </div>

  <!-- Pending View -->
  <div id="pendingView" class="pending-view tab-content">
    <div id="pendingViewHeader"></div>
    <div id="pendingListContainer"></div>
  </div>

  <!-- Blend warning dialog container -->
  <div id="blendWarningContainer"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
